name: Release

on:
  # Auto-trigger when an automated data-update PR is merged
  pull_request:
    types: [closed]
    branches: [main]
  # Manual trigger for code-change releases
  workflow_dispatch:

jobs:
  release:
    name: Bump Versions & Update Changelogs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'data-update'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump versions and changelogs
        run: pnpm exec tsx scripts/release-data.ts

      - name: Commit and push
        run: pnpm exec tsx scripts/commit-release.ts
