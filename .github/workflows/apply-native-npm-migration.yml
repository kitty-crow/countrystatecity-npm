name: Apply native npm migration

on:
  push:
    branches: [agent/dependency-deprecation-cleanup]
  pull_request:
    branches: [main]

concurrency:
  group: native-npm-migration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/dependency-deprecation-cleanup
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/migrate.py')
          value = path.read_text(encoding='utf-8')
          value = value.replace(
              'file.write_text(content.rstrip() + "\\n", encoding="utf-8")',
              'file.write_text(content.strip("\\n") + "\\n", encoding="utf-8")',
          )
          path.write_text(value, encoding='utf-8')
          PY
          python3 -m py_compile .github/migrate.py
          python3 .github/migrate.py

      - name: Generate npm lockfile
        run: |
          rm -rf node_modules package-lock.json bun.lock bun.lockb
          npm install --package-lock-only --ignore-scripts

      - name: Install without deprecation warnings
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/npm-ci.log
          if grep -Ei 'npm warn deprecated|DeprecationWarning' /tmp/npm-ci.log; then
            echo 'Deprecated dependencies or runtime APIs were reported.' >&2
            exit 1
          fi

      - name: Require zero npm vulnerabilities
        run: |
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low

      - name: Validate npm and ts-node
        run: |
          npm run check
          npm run check:runtime:ts-node

      - name: Validate Bun
        run: |
          rm -rf node_modules bun.lock bun.lockb
          bun install --no-save
          bun run check:runtime:bun
          bun run check
          rm -rf node_modules bun.lock bun.lockb

      - name: Verify clean migration
        run: |
          test -f package-lock.json
          test ! -e pnpm-lock.yaml
          test ! -e pnpm-workspace.yaml
          test ! -e .github/migrate.py
          test ! -e .github/workflows/apply-native-npm-migration.yml
          npm run check:deprecations

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: use npm workspaces and native APIs'
          git push origin HEAD:agent/dependency-deprecation-cleanup
