name: Apply native npm migration

on:
  pull_request:
    branches: [main]

concurrency:
  group: native-npm-migration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/dependency-deprecation-cleanup
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/migrate.py')
          value = path.read_text(encoding='utf-8')
          value = value.replace(
              'file.write_text(content.rstrip() + "\\n", encoding="utf-8")',
              'file.write_text(content.strip("\\n") + "\\n", encoding="utf-8")',
          )
          path.write_text(value, encoding='utf-8')
          PY
          python3 -m py_compile .github/migrate.py .github/finalise.py .github/fix-validation.py
          python3 .github/migrate.py
          python3 .github/finalise.py
          python3 .github/fix-validation.py

      - name: Generate npm lockfile
        run: |
          rm -rf node_modules package-lock.json bun.lock bun.lockb
          npm install --package-lock-only --ignore-scripts

      - name: Install without deprecation warnings
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/npm-ci.log
          if grep -Ei 'npm warn deprecated|DeprecationWarning' /tmp/npm-ci.log; then
            echo 'Deprecated dependencies or runtime APIs were reported.' >&2
            exit 1
          fi

      - name: Require zero npm vulnerabilities
        run: |
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low

      - name: Validate npm and ts-node without runtime deprecations
        run: |
          NODE_OPTIONS=--throw-deprecation npm run check
          NODE_OPTIONS=--throw-deprecation npm run check:runtime:ts-node

      - name: Validate Bun
        run: |
          rm -rf node_modules bun.lock bun.lockb
          bun install --no-save
          bun run check:runtime:bun
          bun run check
          rm -f bun.lock bun.lockb

      - name: Verify clean migration
        run: |
          test -f package-lock.json
          test ! -e pnpm-lock.yaml
          test ! -e pnpm-workspace.yaml
          test ! -e .github/migrate.py
          test ! -e .github/finalise.py
          test ! -e .github/fix-validation.py
          test ! -e .github/workflows/apply-native-npm-migration.yml
          bun run scripts/check-deprecations.ts

      - name: Export validated patch
        run: |
          rm -rf node_modules .github/__pycache__
          git add -A
          git diff --cached --check
          git diff --cached --binary --full-index > /tmp/native-npm-migration.patch
          test -s /tmp/native-npm-migration.patch

      - uses: actions/upload-artifact@v6
        with:
          name: native-npm-migration
          path: /tmp/native-npm-migration.patch
          retention-days: 1
