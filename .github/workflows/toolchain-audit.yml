name: Apply places 2.1.1

on:
  push:
    branches: [agent/toolchain-cleanup]

permissions:
  contents: write

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/toolchain-cleanup
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Use repository npm version
        run: npm install --global npm@11.16.0
      - name: Apply maintenance release
        run: |
          set -Eeuo pipefail
          npm version 2.1.1 --workspaces --include-workspace-root --no-git-tag-version
          rm .npmrc
          python <<'PY'
          from pathlib import Path

          path = Path('tsup.config.base.ts')
          text = path.read_text()
          old = '  treeshake: true,\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected treeshake configuration')
          path.write_text(text.replace(old, ''))
          PY
      - name: Verify release
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee install.log
          ! grep -E 'npm warn|EBADENGINE|DeprecationWarning' install.log
          npm audit --audit-level=low
          npm run check 2>&1 | tee check.log
          ! grep -E 'Entry module .* using named and default exports together|DeprecationWarning' check.log
      - name: Commit release
        run: |
          set -Eeuo pipefail
          rm .github/workflows/toolchain-audit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .npmrc .github/workflows/toolchain-audit.yml \
            package.json package-lock.json tsup.config.base.ts packages
          git commit -m "build: clean places tooling for 2.1.1"
          git push origin HEAD:agent/toolchain-cleanup
