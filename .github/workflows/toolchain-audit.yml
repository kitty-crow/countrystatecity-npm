name: Validate countries workspace install

on:
  push:
    branches: [agent/toolchain-cleanup]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  countries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Match reported npm version
        run: npm install --global npm@11.14.1
      - name: Remove obsolete npm configuration
        run: rm .npmrc
      - name: Install only the countries workspace
        run: |
          set -o pipefail
          npm ci --ignore-scripts \
            --workspace=@countrystatecity/countries \
            --include-workspace-root=false 2>&1 | tee install.log
          ! grep -E 'npm warn|EBADENGINE|DeprecationWarning' install.log
      - name: Validate countries workspace
        run: |
          npm run typecheck --workspace=@countrystatecity/countries
          npm run build --workspace=@countrystatecity/countries
          npm run test --workspace=@countrystatecity/countries
