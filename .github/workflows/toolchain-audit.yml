name: Toolchain audit

on:
  push:
    branches: [agent/toolchain-cleanup]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22.12.0, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install and capture warnings
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee install.log
      - name: Resolve warning paths
        if: always()
        run: npm explain eslint @eslint/core @inquirer/core glob || true
      - name: Audit dependencies
        if: always()
        run: npm audit --json || true
      - name: Validate repository
        if: always()
        run: npm run check
