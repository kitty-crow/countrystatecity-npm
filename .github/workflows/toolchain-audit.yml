name: Validate isolated countries install

on:
  push:
    branches: [agent/toolchain-cleanup]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  countries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Match reported npm version
        run: npm install --global npm@11.14.1
      - name: Install only the countries package
        working-directory: packages/countries
        run: |
          set -o pipefail
          npm install --ignore-scripts --workspaces=false 2>&1 | tee install.log
          ! grep -E 'npm warn|EBADENGINE|DeprecationWarning' install.log
      - name: Validate countries package
        working-directory: packages/countries
        run: |
          npm run typecheck
          npm run build
          npm run test
