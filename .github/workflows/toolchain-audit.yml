name: Toolchain audit

on:
  push:
    branches: [agent/toolchain-cleanup]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22.12.0, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Inspect candidate engine ranges
        run: |
          for spec in \
            eslint@9.39.2 \
            eslint@10.7.0 \
            @inquirer/search@4.1.6 \
            @inquirer/search@4.2.0 \
            @inquirer/select@5.1.0 \
            @inquirer/select@5.2.0; do
            printf '\n=== %s ===\n' "$spec"
            npm view "$spec" engines --json
          done
      - name: Install and capture warnings
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee install.log
      - name: Resolve warning paths
        if: always()
        run: npm explain eslint @eslint/core @inquirer/core @inquirer/select glob || true
      - name: Audit dependencies
        if: always()
        run: npm audit --json || true
      - name: Validate repository
        if: always()
        run: npm run check
