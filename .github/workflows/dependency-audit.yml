name: Dependency and deprecation audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install without policy or deprecation warnings
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/npm-ci.log
          if grep -Ei 'npm warn deprecated|DeprecationWarning|npm warn allow-scripts' /tmp/npm-ci.log; then
            echo 'An unreviewed install script, deprecated dependency or deprecated runtime API was reported.' >&2
            exit 1
          fi
      - run: npm audit --audit-level=low
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run check:deprecations
      - run: NODE_OPTIONS=--throw-deprecation npm run check:runtime:ts-node

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-save
      - run: bun run check:runtime:bun
      - run: bun run check
