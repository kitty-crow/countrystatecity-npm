name: Prepare places 2.1.2

on:
  push:
    branches: [agent/countries-isolated-cleanup]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22.12.0, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/countries-isolated-cleanup
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Use npm 11
        run: npm install --global npm@11.16.0
      - name: Prepare candidate manifests
        run: |
          set -Eeuo pipefail
          python <<'PY'
          import json
          from pathlib import Path

          paths = [Path('package.json'), *sorted(Path('packages').glob('*/package.json'))]
          for path in paths:
              data = json.loads(path.read_text())
              data['version'] = '2.1.2'
              if path == Path('packages/countries/package.json'):
                  data.pop('allowScripts', None)
                  data['overrides'] = {
                      **data.get('overrides', {}),
                      'esbuild': '0.28.1',
                  }
              path.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Verify standalone countries package
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/countries
          mkdir -p /tmp/countries
          cp packages/countries/package.json /tmp/countries/package.json
          cd /tmp/countries
          set -o pipefail
          npm install --ignore-scripts 2>&1 | tee install.log
          ! grep -E 'npm warn|EBADENGINE|DeprecationWarning' install.log
          npm audit --audit-level=low
      - name: Install repository dependencies
        run: |
          set -o pipefail
          if [ '${{ matrix.node }}' = '24' ]; then
            npm install --ignore-scripts 2>&1 | tee install.log
          else
            npm --prefix packages/countries install --ignore-scripts --workspaces=false --no-audit 2>&1 | tee install.log
          fi
          ! grep -E 'npm warn|EBADENGINE|DeprecationWarning' install.log
      - name: Verify package output
        run: |
          set -Eeuo pipefail
          if [ '${{ matrix.node }}' = '24' ]; then
            npm run check
            npm --prefix packages/countries run build 2>&1 | tee check.log
          else
            npm --prefix packages/countries run typecheck 2>&1 | tee check.log
            npm --prefix packages/countries run build 2>&1 | tee -a check.log
            npm --prefix packages/countries run test 2>&1 | tee -a check.log
          fi
          ! grep -E 'empty-import-meta|import.meta.*not available|Entry module .* using named and default exports together|DeprecationWarning' check.log
      - name: Verify ESM and CommonJS data loading
        run: |
          node --input-type=module <<'NODE'
          const mod = await import('./packages/countries/dist/index.js');
          const rows = await mod.getCountries();
          if (!Array.isArray(rows) || rows.length === 0) throw new Error('ESM countries load failed');
          NODE
          node <<'NODE'
          const mod = require('./packages/countries/dist/index.cjs');
          mod.getCountries().then(rows => {
            if (!Array.isArray(rows) || rows.length === 0) throw new Error('CJS countries load failed');
          });
          NODE
      - name: Audit complete repository
        if: matrix.node == 24
        run: npm audit --audit-level=low

  apply:
    if: github.actor != 'github-actions[bot]'
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/countries-isolated-cleanup
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Use repository npm version
        run: npm install --global npm@11.16.0
      - name: Apply validated release
        run: |
          set -Eeuo pipefail
          python <<'PY'
          import json
          from pathlib import Path

          paths = [Path('package.json'), *sorted(Path('packages').glob('*/package.json'))]
          for path in paths:
              data = json.loads(path.read_text())
              data['version'] = '2.1.2'
              if path == Path('packages/countries/package.json'):
                  data.pop('allowScripts', None)
                  data['overrides'] = {
                      **data.get('overrides', {}),
                      'esbuild': '0.28.1',
                  }
              path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          npm install --ignore-scripts
          rm .github/workflows/countries-isolated-audit.yml
      - name: Commit release
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/workflows/countries-isolated-audit.yml \
            package.json package-lock.json packages src/countries/node.ts
          git commit -m "build: clean isolated countries package for 2.1.2"
          git push origin HEAD:agent/countries-isolated-cleanup
