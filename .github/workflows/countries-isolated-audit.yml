name: Audit isolated countries package

on:
  push:
    branches: [agent/countries-isolated-cleanup]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Match reported npm version
        run: npm install --global npm@11.14.1
      - name: Install isolated package
        working-directory: packages/countries
        run: npm install --ignore-scripts --workspaces=false
      - name: Explain isolated dependency tree
        working-directory: packages/countries
        run: npm explain brace-expansion diff esbuild js-yaml postcss || true
      - name: Audit isolated package
        working-directory: packages/countries
        run: npm audit --json || true
      - name: Build isolated package
        working-directory: packages/countries
        run: npm run build
